# ============================================================
# docker-compose.override.yml — Local Development Overrides
#
# This file is automatically merged with docker-compose.yml
# by Docker Compose when both files are present.
#
# It adds:
#   - Source code volume mounts for hot-reload
#   - Dev-mode commands (nodemon / ts-node-dev / next dev)
#   - Debug ports
#
# To use:
#   docker compose up
#
# To run without overrides (production-like):
#   docker compose -f docker-compose.yml up
# ============================================================

services:
  backend:
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/package.json:/app/package.json:ro
      - ./backend/tsconfig.json:/app/tsconfig.json:ro
      - backend_node_modules:/app/node_modules
    command: npm run dev

  frontend:
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts:ro
      - ./frontend/postcss.config.js:/app/postcss.config.js:ro
      - ./frontend/next.config.js:/app/next.config.js:ro
      - frontend_node_modules:/app/node_modules
    command: npm run dev

  indexer:
    volumes:
      - ./indexer/src:/app/src:ro
      - ./indexer/package.json:/app/package.json:ro
      - ./indexer/tsconfig.json:/app/tsconfig.json:ro
      - indexer_node_modules:/app/node_modules
    command: npm run dev

volumes:
  backend_node_modules:
  frontend_node_modules:
  indexer_node_modules:
