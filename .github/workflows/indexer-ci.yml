name: Indexer CI

on:
  push:
    paths:
      - 'indexer/**'
  pull_request:
    paths:
      - 'indexer/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: TypeScript Build + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: indexer/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: indexer/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('indexer/package-lock.json') }}

      - name: Install dependencies
        working-directory: indexer
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Security Audit - npm HIGH/CRITICAL vulnerabilities
        working-directory: indexer
        run: npm audit --audit-level=high

      - name: Build
        working-directory: indexer
        run: npm run build

      - name: Test
        working-directory: indexer
        run: npm test
