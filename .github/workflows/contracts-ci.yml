name: Contracts CI

on:
  push:
    paths:
      - 'contracts/**'
  pull_request:
    paths:
      - 'contracts/**'
  schedule:
    - cron: '0 3 * * *'  # nightly 03:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust Tests + Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Clippy
        working-directory: contracts
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Tests disabled - test structure refactoring in progress
      # - name: Tests
      #   working-directory: contracts
      #   run: cargo test --all --all-features

      - name: Build wasm
        working-directory: contracts
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Audit dependencies
        working-directory: contracts
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings --deny unsound --deny yanked

  fuzz:
    name: Fuzz AMM + Payout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine if fuzzing should run
        id: check-fuzz
        run: |
          RUN_FUZZ="false"
          FUZZ_TIME="30"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Triggered by schedule: running full 60s fuzz"
            RUN_FUZZ="true"
            FUZZ_TIME="60"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1 || true
            DIFF_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || git diff --name-only HEAD~1 2>/dev/null || true)
            if echo "$DIFF_FILES" | grep -q "contracts/shared/src/amm\.rs"; then
              echo "Pull request modifies contracts/shared/src/amm.rs: running 30s fuzz"
              RUN_FUZZ="true"
              FUZZ_TIME="30"
            else
              echo "contracts/shared/src/amm.rs not modified: skipping fuzz"
            fi
          else
            echo "Event ${{ github.event_name }} is neither schedule nor pull_request: skipping fuzz"
          fi

          echo "should_run=${RUN_FUZZ}" >> $GITHUB_OUTPUT
          echo "fuzz_time=${FUZZ_TIME}" >> $GITHUB_OUTPUT

      - name: Install Rust nightly
        if: steps.check-fuzz.outputs.should_run == 'true'
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        if: steps.check-fuzz.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Cache cargo-fuzz binary
        if: steps.check-fuzz.outputs.should_run == 'true'
        uses: actions/cache@v4
        id: cache-cargo-fuzz
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: ${{ runner.os }}-cargo-fuzz-bin

      - name: Install cargo-binstall and cargo-fuzz
        if: steps.check-fuzz.outputs.should_run == 'true' && steps.cache-cargo-fuzz.outputs.cache-hit != 'true'
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm cargo-fuzz

      - name: Fuzz AMM price functions
        if: steps.check-fuzz.outputs.should_run == 'true'
        working-directory: contracts/shared
        run: cargo fuzz run amm_fuzz -- -max_total_time=${{ steps.check-fuzz.outputs.fuzz_time }}

      - name: Fuzz payout calculations
        if: steps.check-fuzz.outputs.should_run == 'true'
        working-directory: contracts/shared
        run: cargo fuzz run payout_fuzz -- -max_total_time=${{ steps.check-fuzz.outputs.fuzz_time }}
